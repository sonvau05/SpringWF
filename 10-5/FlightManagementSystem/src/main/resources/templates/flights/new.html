<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Flight Form</h2>

    <form th:action="@{/flights}" th:object="${flight}" method="post">
        <div class="mb-3">
            <label>Flight Number</label>
            <input type="text" th:field="*{flightNumber}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Destination</label>
            <input type="text" th:field="*{destination}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Departure Time</label>
            <input type="datetime-local" th:field="*{departureTime}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">Save</button>
    </form>
</div>
</body>
</html>
